<nav id="nav-actions">
  <h1 class="title nav">ACCESO REMOTO</h1>
  <div class="container-buttons nav">
    <button class="button nav" (click)="grid_template_columns.set(grid_template_columns() == 'repeat(1, 1fr)' ?
     'repeat(3, 1fr)' : 'repeat(1, 1fr)')">
     Cambiar columnas
    </button>
    <button class="button nav" (click)="changeActions($event)">Ocultar/Mostrar acciones</button>
  </div>
</nav>

<div class="computers" [style.grid-template-columns]="grid_template_columns()">
  @for (computer of computers().values(); track computer.id) {
    <card class="computer" [image_64]="computer.image_64" [name_user]="computer.name_user" [isActiveKeyboard]="computer.input_keyboard_enable"
      [isActiveMouse]="computer.input_mouse_enable" [id]="computer.id" [inputLog]="computer.input_log"></card>
  }
</div>
